services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      TRUST_PROXY: 'true'
      SEED_ON_START: 'true'
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - crew-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]

volumes:
  crew-data:
