<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="csp-nonce" content="__CSP_NONCE__" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Crew Board</title>
    <style nonce="__CSP_NONCE__">
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f4f6fb;
        color: #131735;
      }
      .splash {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
      }
      .splash-mark {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #3730a3, #0e7490);
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      .splash p {
        margin: 0;
        font-weight: 600;
      }
      @keyframes splash-pulse {
        50% {
          transform: scale(0.88);
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0f23;
          color: #eef0ff;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <div class="splash-mark" aria-hidden="true"></div>
        <p>Loading Crew Board…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
